category:
  id: "06"
  sheet_name: "6 HRQOL"
  title: "Health-related quality of life (HRQOL)"
  review_question_focus: >-
    How do previously published systematic reviews of cancer treatment build the
    health-related quality of life concept in their database search strategies?
  population_scope: >-
    Cancer type and age left open, per the brief. Two ovarian-specific HRQOL reviews were
    identified and rejected on the JIF >= 5 threshold - Wilson 2018, "A Systematic Review of
    Health-Related Quality of Life Reporting in Ovarian Cancer Phase III Clinical Trials",
    The Oncologist (JIF ~4.8, and the closest miss in this whole exercise), and Kumar 2019,
    "Quality of life outcomes following surgery for advanced ovarian cancer", Int J Gynecol
    Cancer (JIF ~4.1). Cramer 2017 is retained partly because it is restricted to women.
  cross_cutting_note: >-
    The three HRQOL blocks span the full range. Mishra names the instruments (QLQ-C30,
    FACIT, SF-36, HADS, POMS, MSAS and others) as search terms, which is the single most
    transferable idea in this collection - instrument acronyms retrieve trials whose
    abstracts never use the phrase "quality of life". Osanto builds a 40-term PRO block that
    deliberately absorbs anxiety, depression, functional status, fatigue and pain into the
    HRQOL concept. Cramer does not search the outcome at all.

records:
  - title: >-
      Exercise interventions on health-related quality of life for people with cancer during
      active treatment
    first_author_year: "Mishra SI, 2012"
    journal: "Cochrane Database of Systematic Reviews"
    impact_factor: "8.8 (2023 JIF)"
    purpose: >-
      To evaluate the effectiveness of exercise on overall HRQoL and on specific HRQoL
      domains among adults with cancer during active treatment. Included because its HRQoL
      block is the most complete in this collection: alongside the expected controlled
      vocabulary and free text it lists the named measurement instruments, so trials
      reporting only "FACT-G" or "QLQ-C30" are still retrieved.
    pico: |
      P: Adults with any cancer, during active treatment (surgery, chemotherapy,
         radiotherapy, hormonal therapy).
      I: Exercise interventions (aerobic, resistance, combination, mind-body including
         yoga, tai chi, qigong, hydrotherapy).
      C: Usual care, no exercise, or an alternative non-exercise intervention.
      O: Overall HRQoL and HRQoL domains - physical, psychological, social, spiritual
         well-being, pain, fatigue, sleep, body image, vitality; adverse events.
    search_pubmed: |
      [MEDLINE searched via PubMed, inception to May 2010 (430 hits) and January 2010 to
      November 2011 (190 hits). Appendix 1, verbatim - lines 32-58 are the HRQoL block:]
      1-31   [exercise block: exp exercise/; exercise tolerance/; exp exertion/; Pliability/;
             physical fitness/; "Physical Education and Training"/; exp physical endurance/;
             exercise therapy/; exercising.mp.; physical condition$.mp.; stamina.mp.;
             motor activity/; exercise test/; exp Sports/; tai chi.mp. or tai ji/; yoga/;
             muscle stretching exercises/; exp "range of motion, articular"/; pilates.mp.;
             qigong.mp.; chi kung.mp.; resistance training.mp.; mind body therap$.mp.;
             exp complementary therapies/; Bad Ragaz.mp.; Ai Chi.mp.; Halliwick.mp.;
