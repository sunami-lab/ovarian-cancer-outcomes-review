# Known-item set for the relative-recall test of the drafted strategy (draft/blocks_pubmed.yml).
#
# Every item is a real study that SHOULD be retrieved by a review of ovarian cancer
# treatment and patient-centred outcomes in older adults. If the drafted strategy misses
# one, the strategy is at fault, not the item.
#
# Two provenance streams, deliberately independent of the strategy's own vocabulary:
#   (a) studies INCLUDED by the ovarian-specific systematic reviews already in the
#       workbook (Coleridge 2021, Billson 2013) - these are the reviews' own answer keys;
#   (b) patient-reported-outcome and quality-of-life publications of named phase III
#       ovarian cancer trials, plus ovarian studies reporting the other outcome domains.
#       Trials were identified by acronym (SOLO1, PRIMA, ARIEL3, AURELIA, PAOLA-1, ICON8,
#       DESKTOP III, GOG-0218, EORTC 55971), and no acronym appears anywhere in the
#       drafted strategy - so retrieval is not circular.
#
# Every PMID, title, journal and year below was read from PubMed esummary, not recalled.
#
# `hard_case: true` marks items whose TITLE contains no outcome word. These are the items
# that test whether the outcome block works on abstract and MeSH indexing rather than on
# convenient titles - the most informative part of the test.

