category:
  id: "04"
  sheet_name: "4 Depression"
  title: "Depression"
  review_question_focus: >-
    How do previously published systematic reviews of cancer treatment build the depression
    concept in their database search strategies?
  population_scope: >-
    Cancer type left open, per the brief. Two of the three reviews are restricted to older
    adults with cancer or use age as an explicit search block, so the age dimension is
    covered here. The one ovarian-specific option identified (Watts 2015, "Depression and
    anxiety in ovarian cancer: a systematic review and meta-analysis of prevalence rates",
    BMJ Open) was excluded on the JIF >= 5 threshold (BMJ Open JIF ~2.4) - it is worth
    reading anyway if you want an ovarian-specific comparator.
  cross_cutting_note: >-
    Depression is searched on, and searched on well, in all three reviews - unlike functional
    status. Compare the three depression blocks directly: Soong's is four words long, Vita's
    is four controlled-vocabulary terms plus one adjacency, and Kulchycki's spans eight
    controlled-vocabulary terms plus a 20-term text-word line that deliberately reaches into
    mood, distress, hopelessness and wellbeing. Sensitivity differs by roughly an order of
    magnitude.

records:
  - title: >-
      Exercise Interventions for Depression, Anxiety, and Quality of Life in Older Adults
      With Cancer: A Systematic Review and Meta-Analysis
    first_author_year: "Soong RY, 2025"
    journal: "JAMA Network Open"
    impact_factor: "10.5 (2023 JIF)"
    purpose: >-
      To determine whether exercise interventions are associated with improvements in
      psychological outcomes - depression, anxiety and health-related quality of life -
      among older adults with cancer. The closest match in this whole collection to the
      population of interest (older adults with cancer, patient-centred outcomes), and the
      only review here whose search carries an explicit older-adults block. The trade-off is
      sensitivity: the outcome block is four terms with no controlled vocabulary in PubMed.
    pico: |
      P: Older adults with cancer (mean age >= 60 years), any cancer type, any comorbidity.
      I: Exercise interventions - aerobic, resistance and strength training, or mind-body
         exercise (qigong, yoga, tai chi).
      C: Usual care.
      O: Depression severity; anxiety severity; health-related quality of life (HRQOL).
    search_pubmed: |
      [PubMed searched natively, database inception to 5 November 2024.
      eTable 1 in Supplement 1, verbatim:]
      #1 "Geriatrics"[Mesh] OR "Aged"[Mesh] OR Aging OR Aged OR Centenarians
         OR Nonagenarians OR Octogenarians OR Elder* OR Gerontology OR 'older adult*'
      #2 Neoplas*[title/abstract] OR Cancer[title/abstract] OR Malignan*[title/abstract]
      #3 Exercis*[title/abstract] OR Exerciz*[title/abstract]
         OR (Physical*[title/abstract] AND Interven*[title/abstract])
         OR (Physical*[title/abstract] AND Activit*[title/abstract])
      #4 depress* OR anxi* OR burden* OR Stress* OR 'quality of life'
      The four sets are combined with AND. Note the curly quotation marks as printed;
      PubMed will not parse 'older adult*' or 'quality of life' as phrases unless the
      quotes are replaced with straight double quotes.
    search_embase: |
      [Embase, database inception to 5 November 2024. eTable 1, verbatim:]
      #1 'geriatrics'/exp OR 'aged'/exp OR 'aging'/exp OR 'senescence'/exp
         OR 'older adult*' OR 'aging' OR 'centenarians' OR 'nonagenarians'
         OR 'octogenarians' OR 'gerontology' OR 'older people'/exp
      #2 'neoplas*'/exp OR 'cancer'/exp OR 'malignan*'/exp
      #3 'exercis*' OR 'exerciz*' OR (physical* NEAR/2 (intervent* OR activit*))
      #4 'depress*' OR 'depression'/exp OR 'anxi*' OR 'anxiety'/exp OR 'disease burden*'
         OR 'physiological stress*' OR 'quality of life'
      Note: 'neoplas*'/exp and 'malignan*'/exp are printed with truncation inside an
      Emtree explosion, which Embase does not accept; these lines will need repair
      before reuse.
    search_wos: |
      Not searched. Databases searched were PubMed, Embase, PsycINFO and the Cochrane
      Library, from inception to 5 November 2024.
      [Cochrane Library version, verbatim:
      #1 MeSH descriptor: [Geriatrics] explode all trees OR ((Aging OR Aged OR Centenarians
         OR Nonagenarians OR Octogenarians OR Elder* OR Gerontology OR 'older adult*'):ti,ab,kw)
      #2 (neoplas*):ti,ab,kw OR (cancer):ti,ab,kw OR (malignan*):ti,ab,kw
      #3 MeSH descriptor: [Exercise] explode all trees OR (exercis*' OR 'exerciz*'
         OR (physical* NEAR/2 (intervent* OR activit*)):ti,ab,kw)
      #4 MeSH descriptor: [Depression] explode all trees OR (anxi* OR burden* OR Stress*
         OR 'quality of life'):ti,ab,kw)
      PsycINFO version, verbatim:
      #1 (Geriatrics OR Aged OR Aging OR Centenarians OR Nonagenarians OR Octogenarians
         OR Elder* OR Gerontology OR 'Older Adult*').mp.
      #2 (neoplas* OR cancer OR malignan*).ti,ab.
      #3 exp Exercise/ OR exercis*.ti,ab. OR exerciz*.ti,ab.
         OR (physical* adj2 (intervent*.ti,ab. or activit*.ti,ab.))
      #4 (depress* OR anxi* OR burden* OR stress* OR 'quality of life').ti,ab.]
    url: "https://doi.org/10.1001/jamanetworkopen.2024.57859"
    pmid: "39903465"
    pmcid: "PMC11795328"
    doi: "10.1001/jamanetworkopen.2024.57859"
    strategy_source: "eTable 1 (Search Strategy) in Supplement 1"

  - title: "Antidepressants for the treatment of depression in people with cancer"
    first_author_year: "Vita G, 2023"
    journal: "Cochrane Database of Systematic Reviews"
    impact_factor: "8.4 (2023 JIF, Cochrane Library)"
    purpose: >-
      To evaluate the efficacy, tolerability and acceptability of antidepressants for
      treating depressive symptoms in adults (18 years or older) with cancer of any site and
      stage. Included as the reference-standard structure for this outcome: population AND
      depression AND antidepressant, where the depression block pairs three MeSH terms with
      one adjacency that catches adjustment, reactive and dysthymic disorders, and the drug
      block names roughly 70 individual agents alongside five exploded drug classes.
    pico: |
      P: Adults (>= 18 years) with any primary cancer diagnosis and depression (major
         depressive disorder, adjustment disorder, dysthymic disorder, or depressive
         symptoms measured on a validated scale).
      I: Any antidepressant.
      C: Placebo, or another antidepressant.
      O: Efficacy (change in depressive symptoms, response, remission); tolerability
         (adverse events, dropouts due to adverse events); acceptability (dropouts for any
         reason).
    search_pubmed: |
      [Not searched as PubMed. MEDLINE via Ovid, 1946 to November 2022; latest search date
      24 November 2022. Appendix 2, verbatim:]
      1  exp Neoplasms/
      2  (cancer* or tumor* or tumour* or neoplas* or malignan* or carcinoma*
         or adenocarcinoma* or choriocarcinoma* or lymphoma* or leukemia* or leukaemia*
         or metastat* or sarcoma* or teratoma*).mp.
      3  1 or 2
      4  Depression/
      5  exp Depressive Disorder/
      6  Adjustment Disorders/
      7  (depress* or melanchol* or ((adjustment or reactive or dysthymic) adj5
         disorder*)).mp.
      8  4 or 5 or 6 or 7
      9  drug therapy.fs.
      10 exp Antidepressive Agents/
      11 exp Heterocyclic Compounds/
      12 exp Serotonin Uptake Inhibitors/
      13 exp Adrenergic Uptake Inhibitors/
      14 exp Monoamine Oxidase Inhibitors/
      15 (anti-depress* or antidepress* or drug therap* or pharmacotherap* or trycyclic*
         or TCA* or heterocyclic* or serotonin uptake or SSRI* or SNRI*
         or monoamine oxidase inhibitor* or MAOI*).mp.
      16 (desipramine or imipramine or clomipramine or opipramol or trimipramine or
         lofepramine or dibenzepin or amitriptyline or nortriptyline or protriptyline or
